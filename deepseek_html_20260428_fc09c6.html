<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>深蓝计划 · 心动选择 | 相亲特别版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A1A2E;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            color: #EFF3F8;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #0F2747;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 20px 16px 30px;
            position: relative;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #0F2747;
            border-radius: 32px;
            padding: 24px 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #C0E0FF, #7BA9E0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        .sub {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* 互选提示横幅 */
        .match-banner {
            background: linear-gradient(135deg, #F5B042, #E8912E);
            color: #0F2747;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            margin-bottom: 16px;
            font-weight: 600;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        .guest-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 20px 0;
        }

        .guest-card {
            background: #112F4B;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .guest-card.selected {
            border: 2px solid #F5B042;
            background: #1A3E5E;
            box-shadow: 0 0 0 2px rgba(245,176,66,0.3);
        }

        .guest-card.selected .check-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #F5B042;
            color: #0F2747;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .guest-card .check-badge {
            display: none;
        }

        .guest-photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #0A1A2E;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .guest-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .guest-photo .no-img {
            color: #5F7F9F;
            font-size: 0.7rem;
            text-align: center;
        }

        .guest-info {
            padding: 12px 10px;
            text-align: center;
        }

        .guest-number {
            font-weight: 700;
            font-size: 1rem;
        }

        /* 已选嘉宾栏 */
        .selected-bar {
            background: #1A3A50;
            border-radius: 40px;
            padding: 10px 16px;
            margin: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .selected-tag {
            background: #F5B042;
            color: #0F2747;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .selected-tag .remove {
            cursor: pointer;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        button {
            background: #2C6280;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        button.primary {
            background: #F5B042;
            color: #0F2747;
        }

        button.danger {
            background: #8B3C3C;
        }

        button.secondary {
            background: #2C6280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.85rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 28px;
            border: none;
            background: #1A3A50;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #0F2747;
            border-radius: 32px;
            max-width: 340px;
            width: 100%;
            padding: 24px;
            border: 1px solid #F5B042;
        }

        .modal-content h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .whisper-box {
            background: #1A3A50;
            border-radius: 20px;
            padding: 12px;
            margin-top: 16px;
            font-style: italic;
            border-left: 3px solid #F5B042;
        }

        .msg-list {
            background: #0A1A2E;
            border-radius: 24px;
            padding: 12px;
            max-height: 280px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .msg-item {
            background: #143450;
            padding: 10px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .badge {
            background: #2C6280;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            display: inline-block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #112F4B;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
            font-size: 0.8rem;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #2A4B6E;
        }

        th {
            background: #0A1C2C;
        }

        .admin-section {
            background: #143450;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .flex-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .guest-stats-card {
            display: inline-block;
            background: #0F2747;
            padding: 4px 10px;
            border-radius: 20px;
            margin: 2px;
        }

        .pair-card {
            background: #112F4B;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 8px;
        }

        .photo-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .upload-item {
            background: #0F2747;
            border-radius: 16px;
            padding: 8px;
            text-align: center;
        }

        .upload-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
        }

        hr {
            border-color: #2A4B6E;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ==================== 存储KEY ====================
        const STORAGE = {
            GUESTS: 'DeepBlue_guests',
            PROFILES: 'DeepBlue_profiles',
            VOTES_R1: 'DeepBlue_votes_r1',
            VOTES_R2: 'DeepBlue_votes_r2',
            WHISPERS_R1: 'DeepBlue_whispers_r1',
            WHISPERS_R2: 'DeepBlue_whispers_r2',
            MESSAGES: 'DeepBlue_messages',
            PHOTOS: 'DeepBlue_photos'
        };

        function initData() {
            if(!localStorage.getItem(STORAGE.GUESTS)) {
                const guests = [];
                for(let i=1;i<=20;i++) guests.push({ id: i.toString().padStart(2,'0'), name: `嘉宾${i.toString().padStart(2,'0')}` });
                localStorage.setItem(STORAGE.GUESTS, JSON.stringify(guests));
            }
            if(!localStorage.getItem(STORAGE.PROFILES)) {
                const profiles = {};
                for(let i=1;i<=20;i++) profiles[i.toString().padStart(2,'0')] = { age: '?', job: '待填写', intro: '期待与你相遇' };
                localStorage.setItem(STORAGE.PROFILES, JSON.stringify(profiles));
            }
            if(!localStorage.getItem(STORAGE.PHOTOS)) localStorage.setItem(STORAGE.PHOTOS, '{}');
            if(!localStorage.getItem(STORAGE.VOTES_R1)) localStorage.setItem(STORAGE.VOTES_R1, '{}');
            if(!localStorage.getItem(STORAGE.VOTES_R2)) localStorage.setItem(STORAGE.VOTES_R2, '{}');
            if(!localStorage.getItem(STORAGE.WHISPERS_R1)) localStorage.setItem(STORAGE.WHISPERS_R1, '{}');
            if(!localStorage.getItem(STORAGE.WHISPERS_R2)) localStorage.setItem(STORAGE.WHISPERS_R2, '{}');
            if(!localStorage.getItem(STORAGE.MESSAGES)) localStorage.setItem(STORAGE.MESSAGES, '[]');
        }

        function getGuests() { return JSON.parse(localStorage.getItem(STORAGE.GUESTS)); }
        function getProfiles() { return JSON.parse(localStorage.getItem(STORAGE.PROFILES)); }
        function getPhotos() { return JSON.parse(localStorage.getItem(STORAGE.PHOTOS)); }
        function savePhotos(p) { localStorage.setItem(STORAGE.PHOTOS, JSON.stringify(p)); }
        function saveProfiles(p) { localStorage.setItem(STORAGE.PROFILES, JSON.stringify(p)); }
        function getVotes(round) { return JSON.parse(localStorage.getItem(round===1?STORAGE.VOTES_R1:STORAGE.VOTES_R2)); }
        function saveVotes(round, data) { localStorage.setItem(round===1?STORAGE.VOTES_R1:STORAGE.VOTES_R2, JSON.stringify(data)); }
        function getWhispers(round) { return JSON.parse(localStorage.getItem(round===1?STORAGE.WHISPERS_R1:STORAGE.WHISPERS_R2)); }
        function saveWhispers(round, data) { localStorage.setItem(round===1?STORAGE.WHISPERS_R1:STORAGE.WHISPERS_R2, JSON.stringify(data)); }
        function getMessages() { return JSON.parse(localStorage.getItem(STORAGE.MESSAGES)); }
        function addMessage(nickname, code, text) {
            let msgs = getMessages();
            msgs.push({ nickname, code, text, timestamp: new Date().toISOString() });
            localStorage.setItem(STORAGE.MESSAGES, JSON.stringify(msgs));
        }

        function getMutualPairs(round) {
            const votes = getVotes(round);
            const pairs = [];
            const users = Object.keys(votes);
            for(let i=0;i<users.length;i++){
                for(let j=i+1;j<users.length;j++){
                    const uA=users[i], uB=users[j];
                    const codeA = uA.split('_')[0], codeB = uB.split('_')[0];
                    if(votes[uA]?.includes(codeB) && votes[uB]?.includes(codeA)) pairs.push({ userA: uA, userB: uB, codeA, codeB });
                }
            }
            return pairs;
        }

        function getUserMutualMatches(userKey, round) {
            const pairs = getMutualPairs(round);
            return pairs.filter(p => p.userA === userKey || p.userB === userKey);
        }

        function getUnlockedWhispers(userKey, round) {
            const pairs = getMutualPairs(round);
            const myMatches = pairs.filter(p => p.userA === userKey || p.userB === userKey);
            if(myMatches.length === 0) return [];
            const allWhispers = getWhispers(round);
            const unlocked = [];
            for(let match of myMatches){
                const otherKey = match.userA === userKey ? match.userB : match.userA;
                const otherWhisper = allWhispers[otherKey];
                if(otherWhisper){
                    const myCode = userKey.split('_')[0];
                    if(otherWhisper[myCode]) unlocked.push({ from: otherKey, message: otherWhisper[myCode], code: otherKey.split('_')[0] });
                }
            }
            return unlocked;
        }

        let currentView = 'user';
        function render() {
            const app = document.getElementById('app');
            if(currentView === 'adminLogin') renderAdminLogin(app);
            else if(currentView === 'admin') renderAdminPanel(app);
            else renderUserPanel(app);
        }

        // 用户端 - 修复选中交互
        function renderUserPanel(container) {
            let userKey = sessionStorage.getItem('userKey');
            let userNick = sessionStorage.getItem('userNick');
            let userCode = sessionStorage.getItem('userCode');
            let userRound = sessionStorage.getItem('userRound');

            if(!userKey || !userNick || !userCode){
                container.innerHTML = `
                    <div class="app-container">
                        <h1>💙 深蓝计划 · 心动选择</h1>
                        <div class="sub">遇见即心动</div>
                        <div class="form-group"><label>编号 (01-20)</label><input id="codeInput" placeholder="例如 05"></div>
                        <div class="form-group"><label>昵称</label><input id="nickInput" placeholder="例如 小蓝"></div>
                        <button id="loginBtn" class="primary">进入选择</button>
                    </div>
                `;
                document.getElementById('loginBtn')?.addEventListener('click', ()=>{
                    let code = document.getElementById('codeInput').value.trim();
                    let nick = document.getElementById('nickInput').value.trim();
                    if(!code || !nick) return alert('请完整填写');
                    code = code.padStart(2,'0');
                    if(parseInt(code)<1 || parseInt(code)>20) return alert('编号01-20');
                    const key = `${code}_${nick}`;
                    const r1Votes = getVotes(1);
                    const round = r1Votes[key] ? '2' : '1';
                    sessionStorage.setItem('userKey', key);
                    sessionStorage.setItem('userNick', nick);
                    sessionStorage.setItem('userCode', code);
                    sessionStorage.setItem('userRound', round);
                    render();
                });
                return;
            }

            const currentRound = parseInt(userRound);
            const guests = getGuests();
            const photos = getPhotos();
            const profiles = getProfiles();
            const existingSelections = getVotes(currentRound)[userKey] || [];
            
            // 状态管理
            let selectedIds = [...existingSelections];
            let whisperCache = {}; // 存储已填写的悄悄话 { guestId: whisper }
            
            // 加载已保存的悄悄话
            const savedWhispers = getWhispers(currentRound)[userKey] || {};
            Object.assign(whisperCache, savedWhispers);

            const myMatches = getUserMutualMatches(userKey, currentRound);
            const hasMatch = myMatches.length > 0;
            const unlockedWhispers = getUnlockedWhispers(userKey, currentRound);

            // 生成嘉宾卡片HTML（带选中标记）
            function buildGuestCards() {
                return guests.map(g => {
                    const isSelected = selectedIds.includes(g.id);
                    const photoUrl = photos[g.id] || '';
                    return `
                        <div class="guest-card ${isSelected ? 'selected' : ''}" data-id="${g.id}">
                            ${isSelected ? '<div class="check-badge">❤️ 已选</div>' : ''}
                            <div class="guest-photo" data-id="${g.id}">
                                ${photoUrl ? `<img src="${photoUrl}" alt="嘉宾${g.id}">` : '<div class="no-img">📷 待上传</div>'}
                            </div>
                            <div class="guest-info">
                                <div class="guest-number">#${g.id}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 已选嘉宾栏
            function buildSelectedBar() {
                if(selectedIds.length === 0) {
                    return `<div class="selected-bar" style="color:#6F8FAA;">💔 尚未选择任何嘉宾</div>`;
                }
                const tags = selectedIds.map(id => `
                    <span class="selected-tag">
                        #${id} 
                        <span class="remove" data-id="${id}">✕</span>
                    </span>
                `).join('');
                return `<div class="selected-bar">✅ 已选：${tags} <span style="font-size:12px;">(点击✕可取消)</span></div>`;
            }

            const unlockedHtml = unlockedWhispers.length > 0 ? 
                `<div class="whisper-box">💌 互选成功解锁的心动悄悄话：<br>${unlockedWhispers.map(w=>`「${escapeHtml(w.message)}」—— 来自嘉宾${w.code}`).join('<br>')}</div>` : '';

            container.innerHTML = `
                <div class="app-container">
                    <h1>💙 心动选择</h1>
                    <div class="sub">${escapeHtml(userNick)} (${userCode}) · 第${currentRound}轮</div>
                    ${hasMatch ? `<div class="match-banner" id="matchBanner">✨ 有人与你互选了！点击查看详情 ✨</div>` : ''}
                    <div id="selectedBarContainer">${buildSelectedBar()}</div>
                    <div class="guest-grid" id="guestGrid">${buildGuestCards()}</div>
                    <button id="submitBtn" class="primary">❤️ 提交心动选择 (最多3人)</button>
                    <button id="resetRoundBtn" class="secondary">✨ 重新选择 / 进入下一轮</button>
                    <div class="message-area">
                        <div>💬 留言区</div>
                        <textarea id="msgInput" rows="2" placeholder="说说你的想法..."></textarea>
                        <button id="sendMsgBtn">发送留言</button>
                        <div class="msg-list" id="msgArea"></div>
                    </div>
                    ${unlockedHtml}
                </div>
            `;

            // 绑定卡片点击事件（选择/取消）
            function bindCardEvents() {
                document.querySelectorAll('.guest-card').forEach(card => {
                    card.removeEventListener('click', cardClickHandler);
                    card.addEventListener('click', cardClickHandler);
                });
                // 绑定移除标签的点击
                document.querySelectorAll('.selected-tag .remove').forEach(btn => {
                    btn.removeEventListener('click', removeHandler);
                    btn.addEventListener('click', removeHandler);
                });
            }

            function cardClickHandler(e) {
                // 防止点到内部元素冒泡
                const card = e.currentTarget;
                const gid = card.dataset.id;
                const idx = selectedIds.indexOf(gid);
                
                if(idx !== -1) {
                    // 已选中 -> 取消选中
                    selectedIds.splice(idx, 1);
                    // 不清除悄悄话，保留以便重新选中时恢复
                } else {
                    // 未选中 -> 检查上限
                    if(selectedIds.length >= 3) {
                        alert('最多只能选择3位心动嘉宾');
                        return;
                    }
                    selectedIds.push(gid);
                    
                    // 如果没有写过悄悄话，弹窗询问
                    if(!whisperCache[gid]) {
                        setTimeout(() => {
                            const whisper = prompt(`💌 对嘉宾${gid}说句悄悄话（限30字，选填）:`, "");
                            if(whisper !== null && whisper.length > 30) {
                                alert('悄悄话不能超过30字');
                            } else if(whisper !== null) {
                                whisperCache[gid] = whisper || '';
                            }
                            updateUI();
                        }, 50);
                        return;
                    }
                }
                updateUI();
            }

            function removeHandler(e) {
                e.stopPropagation();
                const id = e.currentTarget.dataset.id;
                const idx = selectedIds.indexOf(id);
                if(idx !== -1) selectedIds.splice(idx, 1);
                updateUI();
            }

            function updateUI() {
                // 重新生成卡片和已选栏
                const grid = document.getElementById('guestGrid');
                const barContainer = document.getElementById('selectedBarContainer');
                if(grid) grid.innerHTML = buildGuestCards();
                if(barContainer) barContainer.innerHTML = buildSelectedBar();
                bindCardEvents();
            }

            bindCardEvents();

            // 提交
            document.getElementById('submitBtn')?.addEventListener('click', ()=>{
                if(selectedIds.length === 0) return alert('请至少选择1位心动嘉宾');
                // 保存投票和悄悄话
                const votesMap = getVotes(currentRound);
                votesMap[userKey] = selectedIds;
                saveVotes(currentRound, votesMap);
                
                const whisMap = getWhispers(currentRound);
                whisMap[userKey] = whisperCache;
                saveWhispers(currentRound, whisMap);
                
                alert(`第${currentRound}轮提交成功！${selectedIds.length}位嘉宾，悄悄话已保存`);
                render();
            });

            document.getElementById('resetRoundBtn')?.addEventListener('click', ()=>{
                if(currentRound === 1){
                    sessionStorage.setItem('userRound', '2');
                    alert('进入第二轮心动选择，可以重新选择嘉宾');
                } else {
                    alert('重新选择本轮嘉宾，之前的选择将被覆盖');
                }
                render();
            });

            document.getElementById('sendMsgBtn')?.addEventListener('click', ()=>{
                const txt = document.getElementById('msgInput').value.trim();
                if(!txt) return;
                addMessage(userNick, userCode, txt);
                document.getElementById('msgInput').value = '';
                loadMessages();
            });

            document.getElementById('matchBanner')?.addEventListener('click', ()=>{
                const matches = getUserMutualMatches(userKey, currentRound);
                if(matches.length){
                    alert(`✨ 互选成功 ✨\n您与以下编号双向选择了对方：${matches.map(m=>m.codeA === userCode ? m.codeB : m.codeA).join(', ')}\n悄悄话已解锁，查看下方区域～`);
                } else {
                    alert('暂无新互选结果');
                }
            });

            function loadMessages(){
                const msgs = getMessages();
                const area = document.getElementById('msgArea');
                if(area){
                    area.innerHTML = msgs.slice(-20).reverse().map(m=>`<div class="msg-item"><div class="msg-meta">${escapeHtml(m.nickname)}(${m.code}) ${new Date(m.timestamp).toLocaleTimeString()}</div><div>${escapeHtml(m.text)}</div></div>`).join('');
                    if(msgs.length === 0) area.innerHTML = '<div class="msg-item">暂无留言，来发第一条吧～</div>';
                }
            }
            loadMessages();
            if(window.msgInterval) clearInterval(window.msgInterval);
            window.msgInterval = setInterval(() => { if(currentView==='user') loadMessages(); }, 3000);
        }

        // 后台登录
        function renderAdminLogin(container){
            container.innerHTML = `<div style="max-width:400px;margin:80px auto;background:#0F2747;padding:32px;border-radius:48px;"><h2>🔐 后台管理</h2><input type="password" id="pwd" placeholder="密码" style="margin:16px 0"><button id="login">登录</button></div>`;
            document.getElementById('login')?.addEventListener('click',()=>{
                if(document.getElementById('pwd').value === 'deepblue2025'){ currentView='admin'; render(); }
                else alert('密码错误');
            });
        }

        // 后台面板（保持原有完整功能）
        function renderAdminPanel(container){
            const guests = getGuests();
            const profiles = getProfiles();
            const photos = getPhotos();
            const r1Votes = getVotes(1), r2Votes = getVotes(2);
            const r1Whispers = getWhispers(1), r2Whispers = getWhispers(2);
            const r1Mutual = getMutualPairs(1), r2Mutual = getMutualPairs(2);

            function countSelected(votesMap){
                const counts = {};
                guests.forEach(g=>counts[g.id]=0);
                Object.values(votesMap).forEach(selections=>{ selections?.forEach(sid=>{ if(counts[sid]!==undefined) counts[sid]++; }); });
                return counts;
            }
            const r1Counts = countSelected(r1Votes);
            const r2Counts = countSelected(r2Votes);

            let guestRows = guests.map(g=>`<tr><td>${g.id}</td><td>${r1Counts[g.id]}</td><td>${r2Counts[g.id]}</td><td>${r1Counts[g.id]+r2Counts[g.id]}</td><td><input class="profileAge" data-id="${g.id}" value="${escapeHtml(profiles[g.id]?.age||'')}" placeholder="年龄" style="width:55px"><input class="profileJob" data-id="${g.id}" value="${escapeHtml(profiles[g.id]?.job||'')}" placeholder="职业"><input class="profileIntro" data-id="${g.id}" value="${escapeHtml(profiles[g.id]?.intro||'')}" placeholder="一句话介绍"></td></tr>`).join('');
            
            let whispersHtml = '';
            for(let round=1;round<=2;round++){
                const whisMap = round===1?r1Whispers:r2Whispers;
                whispersHtml += `<h4>📝 第${round}轮悄悄话</h4><div>`;
                let hasAny = false;
                for(let [userKey, map] of Object.entries(whisMap)){
                    for(let [guestId, msg] of Object.entries(map)){
                        whispersHtml += `<div class="guest-stats-card">${escapeHtml(userKey)} → 嘉宾${guestId}: “${escapeHtml(msg)}”</div>`;
                        hasAny = true;
                    }
                }
                if(!hasAny) whispersHtml += '<div>暂无悄悄话</div>';
                whispersHtml += `</div>`;
            }

            let mutualHtml = `<h4>💞 首轮互选 (${r1Mutual.length}对)</h4>`;
            r1Mutual.forEach(p=>{ mutualHtml += `<div class="pair-card">✅ ${escapeHtml(p.userA)} ↔ ${escapeHtml(p.userB)}</div>`; });
            mutualHtml += `<h4>💞 次轮互选 (${r2Mutual.length}对)</h4>`;
            r2Mutual.forEach(p=>{ mutualHtml += `<div class="pair-card">✅ ${escapeHtml(p.userA)} ↔ ${escapeHtml(p.userB)}</div>`; });

            container.innerHTML = `
                <div class="admin-container">
                    <h2>📊 深蓝计划 · 后台管理系统</h2>
                    <div class="flex-row"><span class="badge">首轮提交:${Object.keys(r1Votes).length}</span><span class="badge">次轮提交:${Object.keys(r2Votes).length}</span><button id="clearAll" class="danger">⚠️ 清空全部数据</button></div>
                    <div class="admin-section"><h3>🖼️ 嘉宾照片管理</h3><div id="photoGrid" class="photo-upload-grid"></div></div>
                    <div class="admin-section"><h3>📝 批量资料卡配置</h3>
                        <table><thead><tr><th>编号</th><th>首轮被选</th><th>次轮被选</th><th>总计</th><th>资料(年龄/职业/介绍)</th></tr></thead><tbody>${guestRows}</tbody></table>
                        <button id="saveProfilesBtn" class="primary">💾 保存所有资料卡</button>
                    </div>
                    <div class="admin-section"><h3>💌 所有悄悄话汇总</h3>${whispersHtml}</div>
                    <div class="admin-section"><h3>💞 互选配对详情</h3>${mutualHtml}</div>
                    <div class="admin-section"><h3>💬 实时留言板</h3><div id="adminMsgs" class="msg-list" style="max-height:300px"></div></div>
                </div>
            `;

            const photoGrid = document.getElementById('photoGrid');
            if(photoGrid){
                guests.forEach(g=>{
                    const imgSrc = photos[g.id]||'';
                    photoGrid.innerHTML += `<div class="upload-item"><div>${g.id}</div>${imgSrc?`<img src="${imgSrc}">`:'<div style="height:80px;background:#1A3A50;border-radius:16px;"></div>'}<input type="file" class="uploadPhoto" data-id="${g.id}" accept="image/*"></div>`;
                });
                document.querySelectorAll('.uploadPhoto').forEach(inp=>{
                    inp.addEventListener('change', e=>{
                        const file = e.target.files[0];
                        const id = inp.dataset.id;
                        if(file){
                            const reader = new FileReader();
                            reader.onload = ev=>{ const newPhotos = getPhotos(); newPhotos[id]=ev.target.result; savePhotos(newPhotos); renderAdminPanel(container); };
                            reader.readAsDataURL(file);
                        }
                    });
                });
            }

            document.getElementById('saveProfilesBtn')?.addEventListener('click',()=>{
                const newProfiles = {...getProfiles()};
                guests.forEach(g=>{
                    const ageInp = document.querySelector(`.profileAge[data-id="${g.id}"]`);
                    const jobInp = document.querySelector(`.profileJob[data-id="${g.id}"]`);
                    const introInp = document.querySelector(`.profileIntro[data-id="${g.id}"]`);
                    if(ageInp) newProfiles[g.id] = { age: ageInp.value, job: jobInp.value, intro: introInp.value };
                });
                saveProfiles(newProfiles);
                alert('资料卡已保存');
            });

            function refreshMsgs(){
                const msgs = getMessages();
                const area = document.getElementById('adminMsgs');
                if(area) area.innerHTML = msgs.slice().reverse().map(m=>`<div class="msg-item"><div>${escapeHtml(m.nickname)}(${m.code}) ${new Date(m.timestamp).toLocaleString()}</div><div>${escapeHtml(m.text)}</div></div>`).join('');
            }
            refreshMsgs();
            if(window.adminInterval) clearInterval(window.adminInterval);
            window.adminInterval = setInterval(()=>{ if(currentView==='admin') refreshMsgs(); }, 2000);
            
            document.getElementById('clearAll')?.addEventListener('click',()=>{
                if(confirm('⚠️ 清空所有投票、悄悄话、留言、照片，不可恢复！')){
                    localStorage.clear();
                    initData();
                    renderAdminPanel(container);
                }
            });
        }

        function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

        initData();
        if(window.location.hash === '#admin') currentView = 'adminLogin';
        else currentView = 'user';
        render();
        window.addEventListener('hashchange',()=>{ currentView = window.location.hash === '#admin' ? 'adminLogin' : 'user'; render(); });
    </script>
</body>
</html>
